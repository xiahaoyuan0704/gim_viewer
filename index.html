<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字化中心 GIM 解析软件</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #e6e6e6;
        --surface: #111111;
        --surface-raised: #1b1b1b;
        --surface-hover: #2b2b2b;
        --border: rgba(255, 255, 255, .12);
        --border-strong: rgba(255, 255, 255, .22);
        --text: #f5f5f5;
        --muted: #9a9a9a;
        --accent: #f2f2f2;
        --accent-strong: #ffffff;
        --accent-soft: rgba(255, 255, 255, .12);
        --blue: #bdbdbd;
        --shadow: 0 18px 42px rgba(0, 0, 0, .28);
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--canvas); font-family: Inter, "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      button, input { font: inherit; }
      #app { display: flex; width: 100%; height: 100%; overflow: hidden; background: var(--canvas); }

      #sidebar { width: 316px; flex-shrink: 0; color: var(--text); background: linear-gradient(160deg, #171717 0%, #0b0b0b 100%); display: flex; flex-direction: column; border-right: 1px solid var(--border); box-shadow: 10px 0 30px rgba(12, 26, 43, .06); z-index: 2; }
      #sidebar header { padding: 26px 22px 20px; border-bottom: 1px solid var(--border); }
      #sidebar h1 { display: flex; align-items: center; gap: 10px; margin: 0 0 7px; font-size: 20px; font-weight: 650; letter-spacing: .01em; }
      #sidebar h1::before { content: ""; width: 29px; height: 29px; flex: 0 0 29px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #9a9a9a); box-shadow: 0 6px 14px rgba(255, 255, 255, .16); }
      #sidebar p { margin: 0 0 0 39px; font-size: 11px; line-height: 1.5; color: var(--muted); letter-spacing: .02em; }
      #controls { padding: 18px 18px 16px; border-bottom: 1px solid var(--border); display: grid; gap: 9px; }

      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 40px; padding: 9px 14px; border: 1px solid transparent; border-radius: 9px; background: linear-gradient(135deg, #fafafa, #d9d9d9); color: #111; font-size: 13px; font-weight: 650; letter-spacing: .01em; cursor: pointer; box-shadow: 0 7px 16px rgba(0, 0, 0, .22); transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
      .btn:hover { background: linear-gradient(135deg, #ffffff, #e7e7e7); transform: translateY(-1px); box-shadow: 0 10px 20px rgba(0, 0, 0, .32); }
      .btn:active { transform: translateY(0); }
      .btn:disabled { background: #303030; color: #777; box-shadow: none; cursor: not-allowed; transform: none; }
      .btn-secondary { background: rgba(255,255,255,.055); color: #e5e5e5; border-color: var(--border); box-shadow: none; }
      .btn-secondary:hover { background: var(--surface-hover); box-shadow: none; }
      .btn-success { background: linear-gradient(135deg, #fafafa, #d9d9d9); color: #111; }
      .btn-small { width: auto; min-height: 32px; padding: 6px 11px; border-radius: 7px; font-size: 12px; }
      .btn-danger { background: #5a5a5a; color: #fff; }
      .btn-danger:hover { background: #747474; }
      .hidden-input { position: fixed; top: -9999px; left: -9999px; }
      #btn-load-gim::before { content: "＋"; font-size: 18px; font-weight: 400; line-height: .8; }
      #btn-load-local::before { content: "⌑"; font-size: 17px; }
      #btn-clear::before { content: "↻"; font-size: 16px; }
      #btn-project-scale::before { content: "▤"; font-size: 15px; }
      #btn-equipment-inventory::before { content: "▦"; font-size: 15px; }
      #btn-toggle-grid::before { content: "▦"; font-size: 14px; }

      #sidebar-tabs { display: flex; gap: 2px; padding: 11px 10px 0; border-bottom: 1px solid var(--border); }
      .tab-btn { position: relative; flex: 1; padding: 10px 3px 12px; border: none; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; transition: color .18s ease; }
      .tab-btn::after { content: ""; position: absolute; height: 2px; right: 18%; bottom: -1px; left: 18%; border-radius: 99px; background: transparent; transition: background .18s ease, left .18s ease, right .18s ease; }
      .tab-btn:hover { color: #f0f0f0; }
      .tab-btn.active { color: var(--accent); font-weight: 600; }
      .tab-btn.active::after { right: 10%; left: 10%; background: var(--accent); }
      .tab-panel { display: none; flex: 1; min-height: 0; overflow-y: auto; scrollbar-color: #5f5f5f transparent; }
      .tab-panel.active { display: flex; flex-direction: column; }
      .tab-panel::-webkit-scrollbar, #props-drawer-body::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width: 6px; }
      .tab-panel::-webkit-scrollbar-thumb, #props-drawer-body::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb { background: #5f5f5f; border-radius: 99px; }

      #model-list, #gim-header-panel { padding: 13px; }
      .header-card { padding: 12px; border: 1px solid var(--border); border-radius: 9px; background: rgba(255,255,255,.035); }
      .header-card-title { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
      .model-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; margin-bottom: 7px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 9px; font-size: 13px; transition: background .15s, border-color .15s; }
      .model-item:hover { background: var(--surface-hover); border-color: var(--border); }
      .model-item .model-checkbox { margin-right: 8px; accent-color: var(--accent); cursor: pointer; }
      .model-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; }
      .model-item .count-badge { font-size: 11px; background: #333; color: #bbb; padding: 3px 7px; border-radius: 99px; margin-right: 8px; }
      .model-item .actions { display: flex; gap: 6px; }
      .icon-btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 7px; background: rgba(255,255,255,.05); color: #ddd; cursor: pointer; font-size: 13px; line-height: 1; transition: background .16s, color .16s; }
      .icon-btn:hover { background: var(--surface-hover); color: var(--accent); }

      #cbm-tree-panel, #file-dev-panel { padding: 9px 7px; }
      .tree-node { user-select: none; }
      .tree-row { display: flex; align-items: center; min-height: 31px; padding: 4px 8px; border-radius: 7px; cursor: pointer; color: #ddd; font-size: 13px; transition: background .15s, color .15s; }
      .tree-row:hover { background: var(--surface-hover); }
      .tree-row.selected { background: var(--accent-soft); color: #fff; box-shadow: inset 2px 0 var(--accent); }
      .tree-toggle { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #888; flex-shrink: 0; transition: transform .15s; }
      .tree-toggle.expanded { transform: rotate(90deg); }
      .tree-toggle.leaf { visibility: hidden; }
      .tree-icon { margin-right: 7px; font-size: 14px; flex-shrink: 0; filter: saturate(.8); }
      .tree-model-checkbox { width: 15px; height: 15px; margin: 0 8px 0 1px; accent-color: var(--accent); cursor: pointer; }
      .tree-model-row { margin: 2px 0 2px 18px; }
      .ifc-model-group { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
      .tree-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tree-children { display: none; padding-left: 15px; }
      .tree-children.expanded { display: block; }

      #center { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; position: relative; background: var(--canvas); }
      #viewport { flex: 1 1 auto; min-width: 0; overflow: hidden; position: relative; }
      #btn-toggle-grid { position: absolute; top: 16px; left: 16px; z-index: 20; width: auto; min-height: 32px; padding: 6px 10px; border: 1px solid rgba(0,0,0,.18); border-radius: 7px; background: rgba(255,255,255,.9); color: #222; box-shadow: 0 6px 16px rgba(0,0,0,.12); font-size: 11px; font-weight: 600; }
      #btn-toggle-grid:hover { background: #111; color: #fff; transform: none; }
      #loading { position: absolute; top: 22px; right: 22px; padding: 11px 15px; background: rgba(18, 18, 18, .94); color: #f4f4f4; border: 1px solid rgba(255, 255, 255, .2); border-radius: 9px; font-size: 13px; box-shadow: var(--shadow); backdrop-filter: blur(12px); display: none; z-index: 10; }
      #empty-tip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #777; pointer-events: none; text-align: center; }
      #empty-tip::before { content: "GIM"; display: grid; place-items: center; width: 72px; height: 72px; margin-bottom: 19px; border: 1px solid rgba(0, 0, 0, .12); border-radius: 23px; background: rgba(255,255,255,.55); color: var(--accent-strong); font-size: 15px; font-weight: 750; letter-spacing: .12em; box-shadow: 0 12px 30px rgba(69, 112, 140, .1); }
      #empty-tip h2 { margin: 0 0 8px; color: #333; font-size: 22px; font-weight: 650; letter-spacing: .01em; }
      #empty-tip p { margin: 0; font-size: 13px; color: #666; }

      #props-drawer { flex: 0 0 336px; width: 336px; min-width: 0; flex-shrink: 0; color: var(--text); background: linear-gradient(160deg, #171717, #0b0b0b); display: flex; flex-direction: column; border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(12, 26, 43, .06); transition: flex-basis .25s ease, width .25s ease; overflow: hidden; z-index: 2; }
      #props-drawer.collapsed { flex-basis: 0; width: 0; border-left: none; }
      #props-drawer-header { display: flex; align-items: center; justify-content: space-between; min-height: 68px; padding: 16px 17px 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
      #props-drawer-header h3 { margin: 0; font-size: 14px; font-weight: 650; color: #f5f5f5; }
      #props-drawer-header h3::before { content: "▦"; margin-right: 8px; color: var(--accent); }
      #props-drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
      .props-empty { color: #888; font-size: 13px; line-height: 1.7; text-align: center; padding: 50px 20px; }
      .props-header { margin: 0 0 13px; padding: 0 0 11px; border-bottom: 1px solid var(--border); color: var(--accent); font-size: 14px; font-weight: 650; }
      .props-section { margin-bottom: 16px; padding: 11px; border: 1px solid var(--border); border-radius: 9px; background: rgba(255,255,255,.025); }
      .props-section-title { margin: 0 0 7px; color: #aaa; font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
      .props-table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .props-table tr { border-bottom: 1px solid rgba(148, 163, 184, .1); }
      .props-table tr:last-child { border-bottom: none; }
      .props-table td { padding: 6px 4px; vertical-align: top; }
      .props-table .prop-key { width: 40%; color: #aaa; white-space: nowrap; }
      .props-table .prop-val { color: #eee; word-break: break-all; }
      #btn-toggle-props { position: fixed; top: 22px; right: 350px; z-index: 9999; width: 38px; height: 38px; border: 1px solid rgba(15, 43, 62, .12); border-radius: 10px; background: rgba(255,255,255,.86); color: #333; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(24, 60, 84, .12); backdrop-filter: blur(10px); transition: background .2s, color .2s, right .25s ease, transform .2s; }
      #btn-toggle-props:hover { background: #111; color: #fff; transform: translateY(-1px); }

      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .65); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
      .modal-overlay.open { display: flex; }
      .modal { width: 540px; max-width: 90vw; max-height: 80vh; display: flex; flex-direction: column; color: var(--text); background: #151515; border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: 0 24px 60px rgba(2, 10, 20, .45); overflow: hidden; }
      .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 17px 20px; border-bottom: 1px solid var(--border); }
      .modal-header h3 { margin: 0; font-size: 15px; font-weight: 650; }
      .modal-close { width: 29px; height: 29px; border: 1px solid var(--border); border-radius: 7px; background: rgba(255,255,255,.05); color: #e8e8e8; cursor: pointer; font-size: 16px; line-height: 1; }
      .modal-close:hover { background: var(--surface-hover); color: var(--accent); }
      .modal-body { flex: 1; overflow-y: auto; padding: 17px 20px; }
      .modal-footer { display: flex; align-items: center; justify-content: space-between; padding: 13px 20px; border-top: 1px solid var(--border); gap: 8px; }
      .modal-footer .btn { width: auto; min-width: 80px; }
      .modal-list { display: flex; flex-direction: column; gap: 5px; }
      .modal-check-item { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 7px; color: #e6e6e6; font-size: 13px; cursor: pointer; transition: background .15s; }
      .modal-check-item:hover { background: var(--surface-hover); }
      .modal-check-item input[type="checkbox"] { margin: 0; accent-color: var(--accent); }
      .modal-info { margin-bottom: 12px; color: #aaa; font-size: 12px; }
      .project-scale-modal { width: 760px; }
      .project-scale-table { width: 100%; border-collapse: collapse; color: #eee; font-size: 13px; }
      .project-scale-table th, .project-scale-table td { padding: 11px 13px; border: 1px solid var(--border-strong); text-align: left; vertical-align: top; }
      .project-scale-table th { color: #fff; background: rgba(255, 255, 255, .09); font-weight: 650; }
      .project-scale-table td:first-child { width: 46%; color: #bbb; }
      .equipment-inventory-modal { width: 980px; }
      .equipment-inventory-summary { margin-bottom: 12px; color: #aaa; font-size: 12px; }
      .equipment-inventory-table { width: 100%; border-collapse: collapse; color: #eee; font-size: 13px; table-layout: fixed; }
      .equipment-inventory-table th, .equipment-inventory-table td { padding: 10px 12px; border: 1px solid var(--border-strong); text-align: left; vertical-align: top; word-break: break-word; }
      .equipment-inventory-table th { position: sticky; top: -17px; z-index: 1; color: #fff; background: #292929; font-weight: 650; }
      .equipment-inventory-table th:nth-child(1), .equipment-inventory-table td:nth-child(1) { width: 28%; }
      .equipment-inventory-table th:nth-child(2), .equipment-inventory-table td:nth-child(2) { width: 58%; }
      .equipment-inventory-table th:nth-child(3), .equipment-inventory-table td:nth-child(3) { width: 14%; text-align: center; }
      .equipment-inventory-table tbody tr:hover { background: rgba(255,255,255,.045); }
      #selection-menu { position: fixed; z-index: 10000; display: none; min-width: 136px; padding: 5px; border: 1px solid #444; border-radius: 8px; background: #171717; box-shadow: 0 12px 30px rgba(0,0,0,.42); }
      #selection-menu.open { display: grid; gap: 2px; }
      .selection-menu-item { padding: 8px 10px; border: 0; border-radius: 5px; background: transparent; color: #eee; text-align: left; cursor: pointer; font-size: 12px; }
      .selection-menu-item:hover { background: #333; }
      @media (max-width: 900px) { #sidebar { width: 270px; } #props-drawer { flex-basis: 290px; width: 290px; } #btn-toggle-props { right: 303px; } }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 左侧栏 -->
      <aside id="sidebar">
        <header>
          <h1>数字化中心 GIM 解析软件</h1>
        </header>
        <div id="controls">
          <button id="btn-load-gim" class="btn">打开 GIM 文件</button>
          <input id="gim-file-input" class="hidden-input" type="file" accept=".gim" />
          <button id="btn-load-local" class="btn btn-secondary">打开 IFC / STL / SVC 文件</button>
          <input id="file-input" class="hidden-input" type="file" accept=".ifc,.stl,.svc" multiple />
          <button id="btn-clear" class="btn btn-secondary">清空场景</button>
          <button id="btn-project-scale" class="btn btn-secondary">工程规模信息</button>
          <button id="btn-equipment-inventory" class="btn btn-secondary">设备统计清单</button>
        </div>
        <div id="sidebar-tabs">
          <button class="tab-btn active" data-tab="tab-models">模型</button>
          <button class="tab-btn" data-tab="tab-tree">层级树</button>
          <button class="tab-btn" data-tab="tab-filedev">文件设备</button>
          <button class="tab-btn" data-tab="tab-header">文件信息</button>
        </div>
        <div id="tab-models" class="tab-panel active">
          <div id="model-list"></div>
        </div>
        <div id="tab-tree" class="tab-panel">
          <div id="cbm-tree-panel"></div>
        </div>
        <div id="tab-filedev" class="tab-panel">
          <div id="file-dev-panel"></div>
        </div>
        <div id="tab-header" class="tab-panel">
          <div id="gim-header-panel"><div class="props-empty">打开 GIM 文件后显示文件头信息</div></div>
        </div>
      </aside>

      <!-- 中间视口 -->
      <div id="center">
        <div id="viewport">
          <button id="btn-toggle-grid" title="切换网格线">隐藏网格线</button>
          <div id="loading">准备中...</div>
          <div id="empty-tip" aria-hidden="true"></div>
        </div>
        <button id="btn-toggle-props" title="属性面板">☰</button>
      </div>

      <!-- 右侧属性面板 -->
      <div id="props-drawer">
        <div id="props-drawer-header">
          <h3>属性</h3>
          <button id="btn-close-props" class="icon-btn" title="收起">✕</button>
        </div>
        <div id="props-drawer-body">
          <div class="props-empty">选择层级树节点查看属性</div>
        </div>
      </div>
    </div>

    <!-- IFC 选择模态框 -->
    <div id="ifc-modal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3>选择要加载的 IFC 文件</h3>
          <button id="modal-close" class="modal-close">✕</button>
        </div>
        <div class="modal-body">
          <div class="modal-info" id="modal-info"></div>
          <div class="modal-list" id="modal-ifc-list"></div>
        </div>
        <div class="modal-footer">
          <div style="display:flex;gap:6px">
            <button id="modal-select-all" class="btn btn-small btn-secondary">全选</button>
            <button id="modal-deselect-all" class="btn btn-small btn-secondary">取消全选</button>
          </div>
          <button id="modal-load" class="btn btn-small btn-success">加载选中</button>
        </div>
      </div>
    </div>

    <!-- 变电站工程规模信息 -->
    <div id="project-scale-modal" class="modal-overlay">
      <div class="modal project-scale-modal">
        <div class="modal-header">
          <h3>变电站工程规模信息</h3>
          <button id="project-scale-close" class="modal-close" title="关闭">✕</button>
        </div>
        <div id="project-scale-body" class="modal-body"></div>
      </div>
    </div>

    <!-- 设备名称、关键参数与数量统计 -->
    <div id="equipment-inventory-modal" class="modal-overlay">
      <div class="modal equipment-inventory-modal">
        <div class="modal-header">
          <h3>设备统计清单</h3>
          <button id="equipment-inventory-close" class="modal-close" title="关闭">✕</button>
        </div>
        <div id="equipment-inventory-body" class="modal-body"></div>
      </div>
    </div>

    <div id="selection-menu">
      <button class="selection-menu-item" data-action="isolate">隔离</button>
      <button class="selection-menu-item" data-action="hide">隐藏</button>
      <button class="selection-menu-item" data-action="show-all">显示全部</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
